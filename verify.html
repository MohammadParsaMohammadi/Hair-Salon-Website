<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید شماره موبایل | لومیر</title>
    
    
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="auth-page">
    
    <!-- Minimal Header -->
    <header class="auth-header">
        <div class="auth-header-container">
            <a href="index.html" class="logo">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                <span>لومیر</span>
            </a>

            <a href="index.html" class="nav-text-link">
                بازگشت به خانه
            </a>
        </div>
    </header>

    <main class="auth-main">
        <!-- Floating Decorative Background Elements -->
        <div class="blur-circle circle-top-right"></div>
        <div class="blur-circle circle-bottom-left"></div>

        <!-- Verification Card -->
        <div class="auth-card" id="verification-card">
            
            <!-- Success Overlay State (Hidden by default) -->
            <div class="success-overlay" id="success-overlay">

                <div class="success-icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>

                <h2>تأیید شد!</h2>

                <p>
                    شماره موبایل با موفقیت تأیید شد.
                </p>

            </div>


            <!-- Standard Card Content Wrapper -->
            <div class="card-content-wrapper" id="card-content-wrapper">
                
                <!-- Top Section -->
                <div class="auth-top">

                    <div class="icon-circle">
                        <!-- Shield Check Icon -->
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <polyline points="9 11 11 13 15 9"></polyline>
                        </svg>
                    </div>

                    <h1>
                        تأیید شماره موبایل
                    </h1>

                    <p class="text-muted">
                        کد ۴ رقمی ارسال شده به 
                        <span class="phone-link" id="phone-number-link">
                            09••• ••• ••34
                        </span>
                        را وارد کنید.
                    </p>

                </div>


                <!-- Error State Banner (Initially Hidden) -->
                <div class="error-banner" id="error-banner">

                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>

                    <span id="error-text">
                        کد تأیید اشتباه است.
                    </span>

                </div>


                <!-- OTP Form -->
                <form id="otp-form" class="auth-form" autocomplete="off">
                    
                    <!-- OTP Inputs -->
                    <div class="otp-container" id="otp-container">

                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="رقم ۱" required>

                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="رقم ۲" required>

                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="رقم ۳" required>

                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="رقم ۴" required>

                    </div>


                    <!-- Countdown Live Section -->
                    <div class="countdown-section">

                        <p id="countdown-desc">
                            کد را دریافت نکرده‌اید؟
                        </p>

                        <button type="button" class="resend-btn" id="resend-action" disabled>
                            ارسال مجدد کد در 
                            <span id="timer">01:30</span>
                        </button>

                    </div>


                    <!-- Submit Button -->
                    <button onclick="window.location='customer-dashboard.html'" type="submit" id="verify-btn" class="btn btn-primary w-100" disabled>

                        <!-- <span class="btn-text"> -->
                            تأیید
                        <!-- </span> -->

                        <div class="spinner" id="btn-spinner" style="display: none;"></div>

                    </button>

                </form>


                <!-- Change Number Bottom Link -->
                <!-- <div class="bottom-action">

                    <span>
                        شماره موبایل اشتباه است؟
                    </span>

                    <a href="register.html" class="action-link">
                        تغییر شماره
                    </a>

                </div> -->


            </div>

        </div>

    </main>

    <script src="assets/js/verify.js"></script>

</body>
</html>
